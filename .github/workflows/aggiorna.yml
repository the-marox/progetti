# Radar Porcini - aggiornamento automatico dei dati della versione su GitHub Pages, con avvisi via mail.
# Va messo nel repository the-marox/progetti (ramo master) in: .github/workflows/aggiorna.yml
# I dati si leggono e si salvano nel ramo gh-pages, cartella radar-porcini.
# Gli orari di GitHub sono in UTC (ora solare italiana = UTC+1, ora legale = UTC+2).
#
# Avvisi via mail (facoltativi): servono tre segreti del repository (Settings > Secrets and variables > Actions):
#   POSTI               il testo di «Copia i miei dati» dell'app (i posti restano privati: non finiscono sul sito)
#   GMAIL_USER          l'indirizzo Gmail che invia e riceve la mail
#   GMAIL_APP_PASSWORD  una password per le app di Google (16 lettere)
# Gli avvisi si calcolano solo nel giro completo del mattino (se GitHub lo salta, lo recupera il giro dopo):
# una mail al massimo al giorno, e solo se un posto diventa buono o ottimo in un giorno che non era gia' stato segnalato.
# Il registro delle esecuzioni di un repository pubblico lo vede chiunque: non vi si scrivono mai nomi o coordinate dei posti.
#
# Newsletter (facoltativa): chi ha un account nell'app e mette la spunta «Ricevi la newsletter» riceve la stessa mail sui
# posti salvati nel suo account. Serve il segreto
#   FIREBASE_SERVICE_ACCOUNT  la chiave JSON di un account di servizio del progetto Firebase «radar-porcini»
# e la mail parte da GMAIL_USER. Solo indirizzi confermati; nel registro solo numeri, mai indirizzi, nomi o coordinate.
name: Aggiorna Radar Porcini

on:
  schedule:
    - cron: "20 8 * * *"         # giro completo dopo la lettura delle 9 (ora solare), con gli avvisi
    - cron: "20 9-18 * * *"      # ogni ora in giornata: solo misure e previsioni (completo se quello del mattino e' saltato)
                                  # tanti giri perche' GitHub ne ritarda o ne salta alcuni: se uno manca, c'e' quello dopo
  workflow_dispatch:              # pulsante "Run workflow" per lanciarlo a mano, e avvio dall'esterno agli orari (vedi README)
    inputs:
      completo:
        description: "Aggiorna anche archivio e radar e controlla gli avvisi"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar-porcini
  cancel-in-progress: false

env:
  APP: radar-porcini   # cartella del sito (ramo gh-pages) con aggiorna.py e i file JSON
  SITO_URL: https://the-marox.github.io/progetti/radar-porcini/

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Strumenti
        run: |
          pip install -q numpy pillow pygrib playwright
          python -m playwright install --with-deps chromium

      - name: Avvisi gia' segnalati
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stato
          key: avvisi-${{ github.run_id }}
          restore-keys: avvisi-

      - name: Scarica e calcola
        id: calcola
        env:
          POSTI: ${{ secrets.POSTI }}
        run: |
          set +e
          SITO="$GITHUB_WORKSPACE/$APP"
          W="$RUNNER_TEMP/lavoro"; mkdir -p "$W"; cd "$W"
          cp "$SITO/aggiorna.py" .
          # esito.json si aggiorna voce per voce: si parte da quello pubblicato
          [ -f "$SITO/esito.json" ] && cp "$SITO/esito.json" .

          COMPLETO=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.completo }}" = "true" ]; then
            COMPLETO=si
          elif [ "${{ github.event.schedule }}" = "20 8 * * *" ]; then
            COMPLETO=si
          else
            # GitHub a volte ritarda o salta gli orari programmati, e l'avvio dall'esterno chiede completo=false:
            # se oggi il giro completo non c'e' stato, lo fa questo
            ULTIMO=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["archivio"]["quando"][:10])' "$SITO/esito.json" 2>/dev/null)
            if [ "$ULTIMO" != "$(date -u +%F)" ]; then
              COMPLETO=si
              echo "Oggi il giro completo non c'e' stato (ultimo: ${ULTIMO:-mai}): lo faccio adesso"
            fi
          fi

          echo "completo=$COMPLETO" >> "$GITHUB_OUTPUT"

          r=$(timeout 600 python3 -I aggiorna.py misure); echo "$r"
          if echo "$r" | grep -q '"data": *"errore'; then
            sleep 120; timeout 600 python3 -I aggiorna.py misure
          fi
          timeout 600 python3 -I aggiorna.py previsioni
          if [ "$COMPLETO" = si ]; then
            S=""; [ -f "$SITO/storico.json" ] && S="$SITO/storico.json"
            R=""; [ -f "$SITO/radar.json" ] && R="$SITO/radar.json"
            timeout 600 python3 -I aggiorna.py archivio $S
            timeout 900 python3 -I aggiorna.py radar $R
          fi

          # avvisi per i posti salvati: calcolati nella pagina vera dell'app, con i dati appena scaricati
          if [ "$COMPLETO" = si ] && [ -n "$POSTI" ]; then
            P="$RUNNER_TEMP/posti"; mkdir -p "$P"
            printf '%s' "$POSTI" > "$P/posti.json"
            for f in data.json aria.json previsioni.json storico.json radar.json sentieri.json; do
              [ -f "$f" ] || { [ -f "$SITO/$f" ] && cp "$SITO/$f" .; }
            done
            PREC=""; [ -f "$RUNNER_TEMP/stato/avvisi.json" ] && PREC="$RUNNER_TEMP/stato/avvisi.json"
            timeout 400 python3 -I aggiorna.py avvisi "$P/posti.json" "$SITO/index.html" $PREC
            rm -rf "$P"
            # avvisi.json contiene i nomi dei posti: resta qui e non va sul sito
            [ -f avvisi.json ] && mv avvisi.json "$RUNNER_TEMP/avvisi.json" && echo "avvisi=si" >> "$GITHUB_OUTPUT"
          fi

          # solo i file validi sostituiscono quelli pubblicati
          python3 -I aggiorna.py valida "$W/pubblica"
          cp "$W"/pubblica/*.json "$SITO"/ 2>/dev/null
          exit 0

      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$APP"
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "Radar Porcini: dati del $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q origin gh-pages && git push origin HEAD:gh-pages
          fi

      - name: Mail
        id: mail
        if: steps.calcola.outputs.avvisi == 'si'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # la mail si compone in aggiorna.py; i giorni segnalati si ricordano solo se la mail parte
          A="$GITHUB_WORKSPACE/$APP/aggiorna.py"
          grep -q 'args\[0\] == "mail"' "$A" || { echo "aggiorna.py del sito non sa ancora mandare la mail: va unita la sua modifica"; exit 1; }
          python3 -I "$A" mail "$RUNNER_TEMP/avvisi.json" "$RUNNER_TEMP/stato"

      - name: Newsletter
        id: newsletter
        if: ${{ !cancelled() && steps.calcola.outputs.completo == 'si' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Manca il segreto FIREBASE_SERVICE_ACCOUNT: niente newsletter"
            exit 0
          fi
          grep -q 'args\[0\] == "newsletter"' "$GITHUB_WORKSPACE/$APP/aggiorna.py" || { echo "aggiorna.py del sito non sa ancora mandare la newsletter: va unita la sua modifica"; exit 1; }
          pip install -q firebase-admin
          # i punteggi si calcolano con i dati appena pubblicati; indirizzi e posti restano in memoria
          cd "$GITHUB_WORKSPACE/$APP"
          timeout 900 python3 -I aggiorna.py newsletter index.html "$RUNNER_TEMP/stato"

      - name: Ricorda gli avvisi
        # avvisi.json cambia solo se la mail parte; newsletter.json tiene, per ogni iscritto, i giorni gia' segnalati
        if: ${{ !cancelled() && (steps.mail.outcome == 'success' || steps.newsletter.outcome == 'success' || steps.newsletter.outcome == 'failure') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stato
          key: avvisi-${{ github.run_id }}-${{ github.run_attempt }}
