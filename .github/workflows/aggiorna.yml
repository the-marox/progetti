# Radar Porcini - aggiornamento automatico dei dati della versione su GitHub Pages, con avvisi via mail.
# Va messo nel repository the-marox/progetti (ramo master) in: .github/workflows/aggiorna.yml
# I dati si leggono e si salvano nel ramo gh-pages, cartella radar-porcini.
# Gli orari di GitHub sono in UTC (ora solare italiana = UTC+1, ora legale = UTC+2).
#
# Avvisi via mail (facoltativi): servono tre segreti del repository (Settings > Secrets and variables > Actions):
#   POSTI               il testo di «Copia i miei dati» dell'app (i posti restano privati: non finiscono sul sito)
#   GMAIL_USER          l'indirizzo Gmail che invia e riceve la mail
#   GMAIL_APP_PASSWORD  una password per le app di Google (16 lettere)
# Gli avvisi si calcolano solo nel giro completo del mattino: una mail al massimo al giorno,
# e solo se un posto diventa buono o ottimo in un giorno che non era gia' stato segnalato.
name: Aggiorna Radar Porcini

on:
  schedule:
    - cron: "20 8 * * *"         # giro completo dopo la lettura delle 9 (ora solare), con gli avvisi
    - cron: "20 11,14,17 * * *"  # in giornata: solo misure e previsioni
  workflow_dispatch:              # pulsante "Run workflow" per lanciarlo a mano
    inputs:
      completo:
        description: "Aggiorna anche archivio e radar e controlla gli avvisi"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: radar-porcini
  cancel-in-progress: false

env:
  APP: radar-porcini   # cartella del sito (ramo gh-pages) con aggiorna.py e i file JSON
  SITO_URL: https://the-marox.github.io/progetti/radar-porcini/

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Strumenti
        run: |
          pip install -q numpy pillow pygrib playwright
          python -m playwright install --with-deps chromium

      - name: Avvisi gia' segnalati
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/stato
          key: avvisi-${{ github.run_id }}
          restore-keys: avvisi-

      - name: Scarica e calcola
        id: calcola
        env:
          POSTI: ${{ secrets.POSTI }}
        run: |
          set +e
          SITO="$GITHUB_WORKSPACE/$APP"
          W="$RUNNER_TEMP/lavoro"; mkdir -p "$W"; cd "$W"
          cp "$SITO/aggiorna.py" .
          # esito.json si aggiorna voce per voce: si parte da quello pubblicato
          [ -f "$SITO/esito.json" ] && cp "$SITO/esito.json" .

          COMPLETO=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.completo }}" = "true" ] && COMPLETO=si
          elif [ "${{ github.event.schedule }}" = "20 8 * * *" ]; then
            COMPLETO=si
          fi

          r=$(timeout 600 python3 -I aggiorna.py misure); echo "$r"
          if echo "$r" | grep -q '"data": *"errore'; then
            sleep 120; timeout 600 python3 -I aggiorna.py misure
          fi
          timeout 600 python3 -I aggiorna.py previsioni
          if [ "$COMPLETO" = si ]; then
            S=""; [ -f "$SITO/storico.json" ] && S="$SITO/storico.json"
            R=""; [ -f "$SITO/radar.json" ] && R="$SITO/radar.json"
            timeout 600 python3 -I aggiorna.py archivio $S
            timeout 900 python3 -I aggiorna.py radar $R
          fi

          # avvisi per i posti salvati: calcolati nella pagina vera dell'app, con i dati appena scaricati
          if [ "$COMPLETO" = si ] && [ -n "$POSTI" ]; then
            P="$RUNNER_TEMP/posti"; mkdir -p "$P"
            printf '%s' "$POSTI" > "$P/posti.json"
            for f in data.json aria.json previsioni.json storico.json radar.json sentieri.json; do
              [ -f "$f" ] || { [ -f "$SITO/$f" ] && cp "$SITO/$f" .; }
            done
            PREC=""; [ -f "$RUNNER_TEMP/stato/avvisi.json" ] && PREC="$RUNNER_TEMP/stato/avvisi.json"
            timeout 400 python3 -I aggiorna.py avvisi "$P/posti.json" "$SITO/index.html" $PREC
            rm -rf "$P"
            # avvisi.json contiene i nomi dei posti: resta qui e non va sul sito
            [ -f avvisi.json ] && mv avvisi.json "$RUNNER_TEMP/avvisi.json" && echo "avvisi=si" >> "$GITHUB_OUTPUT"
          fi

          # solo i file validi sostituiscono quelli pubblicati
          python3 -I aggiorna.py valida "$W/pubblica"
          cp "$W"/pubblica/*.json "$SITO"/ 2>/dev/null
          exit 0

      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$APP"
          if git diff --cached --quiet; then
            echo "Nessun dato nuovo"
          else
            git commit -m "Radar Porcini: dati del $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q origin gh-pages && git push origin HEAD:gh-pages
          fi

      - name: Mail
        id: mail
        if: steps.calcola.outputs.avvisi == 'si'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 -I - <<'PY'
          import datetime as dt, html, os

          GG = ["lun", "mar", "mer", "gio", "ven", "sab", "dom"]
          GIORNI = ["lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato", "domenica"]
          MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"]
          LIV = ["quasi nullo", "scarso", "discreto", "buono", "ottimo"]
          COL = [("#D3D8CE", "#3E473A"), ("#C3D6B4", "#23331D"), ("#93BC7F", "#16260F"), ("#55904A", "#FFFFFF"), ("#2B6428", "#FFFFFF")]


          def corto(iso):
              d = dt.date.fromisoformat(iso)
              return "%s %d" % (GG[d.weekday()], d.day)


          def lungo(iso):
              d = dt.date.fromisoformat(iso)
              return "%s %d %s" % (GIORNI[d.weekday()], d.day, MESI[d.month - 1])


          def intervalli(giorni, livello):
              """Giorni consecutivi con quel livello, scritti come «dom 18 – gio 22»."""
              pezzi, inizio, prima = [], None, None
              for g in giorni + [None]:
                  ok = g is not None and g["livello"] == livello
                  if ok and inizio is not None and dt.date.fromisoformat(g["data"]) - dt.date.fromisoformat(prima["data"]) == dt.timedelta(days=1):
                      prima = g
                      continue
                  if inizio is not None:
                      pezzi.append(corto(inizio["data"]) + ("" if inizio is prima else " – " + corto(prima["data"])))
                      inizio = prima = None
                  if ok:
                      inizio = prima = g
              return ", ".join(pezzi)


          def componi(a, sito, oggi=None):
              """Testo semplice e HTML della mail, dai punteggi dei posti calcolati nella pagina."""
              oggi = oggi or dt.datetime.now(dt.timezone.utc).date().isoformat()
              posti = []
              for r in a.get("posti") or []:
                  g = [x for x in r["giorni"] if x["data"] >= oggi]
                  if not g:
                      continue
                  best = max(g, key=lambda x: x["score"])
                  posti.append((r, g, best))
              posti.sort(key=lambda t: -t[2]["score"])
              buoni = [t for t in posti if t[2]["livello"] >= 3]
              altri = [t for t in posti if t[2]["livello"] < 3]
              pioggia = ((a.get("dati") or {}).get("pioggia_al") or "").replace(" (ora solare)", "")

              righe = ["I tuoi posti in Radar Porcini, giorno per giorno.", ""]
              for r, g, best in buoni:
                  sotto = " · ".join(x for x in [r.get("comune") or "", r.get("nomeSpecie") or ""] if x)
                  righe += ["■ " + r["nome"], "  " + sotto,
                            "  Giorno migliore: %s, %d (%s)" % (lungo(best["data"]), best["score"], LIV[best["livello"]])]
                  for liv in (4, 3):
                      s = intervalli(g, liv)
                      if s:
                          righe.append("  %-8s%s" % (LIV[liv].capitalize() + ":", s))
                  righe.append("")
              if altri:
                  righe += ["Sotto «buono» nei prossimi giorni: " + "; ".join("%s (al massimo %d %s)" % (r["nome"], b["score"], corto(b["data"])) for r, g, b in altri) + ".", ""]
              righe += ["Apri l'app: " + sito, "",
                        "Punteggio da 0 a 100: buono da 45, ottimo da 65. È una stima: guarda la scheda del punto prima di andare." +
                        (" Pioggia misurata fino al " + pioggia + "." if pioggia else ""), "",
                        "Ricevi questa mail dal flusso «Aggiorna Radar Porcini» del repository the-marox/progetti. "
                        "Per non riceverla più, cancella il segreto POSTI del repository o disattiva il flusso."]
              testo = "\n".join(righe)

              e = html.escape
              F = "font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;"
              h = ['<div style="%sbackground:#EDF0E8;padding:16px 10px;color:#192017;">' % F,
                   '<div style="max-width:560px;margin:0 auto;">',
                   '<div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#566151;font-weight:700;margin:0 4px 4px;">Radar Porcini</div>',
                   '<div style="font-size:20px;font-weight:800;margin:0 4px 14px;">I tuoi posti nei prossimi giorni</div>']
              for r, g, best in buoni:
                  sotto = " · ".join(x for x in [r.get("comune") or "", r.get("nomeSpecie") or ""] if x)
                  h.append('<div style="background:#F9FAF6;border:1px solid #CED6C7;border-radius:14px;padding:12px 12px 10px;margin-bottom:12px;">')
                  h.append('<table role="presentation" width="100%%" cellpadding="0" cellspacing="0"><tr><td style="vertical-align:top;">'
                           '<div style="font-size:17px;font-weight:700;">%s</div><div style="font-size:13px;color:#566151;">%s</div></td>'
                           '<td style="vertical-align:top;text-align:right;white-space:nowrap;"><span style="display:inline-block;background:%s;color:%s;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;">%d · %s</span>'
                           '<div style="font-size:12px;color:#566151;margin-top:3px;">%s</div></td></tr></table>'
                           % (e(r["nome"]), e(sotto), COL[best["livello"]][0], COL[best["livello"]][1], best["score"], LIV[best["livello"]].capitalize(), e(lungo(best["data"]))))
                  h.append('<div style="margin-top:10px;line-height:0;">')
                  for x in g:
                      bg, fg = COL[x["livello"]]
                      bordo = "outline:2px solid #7A4A21;outline-offset:1px;" if x is best else ""
                      d = dt.date.fromisoformat(x["data"])
                      h.append('<span style="display:inline-block;width:42px;margin:0 3px 6px 0;padding:4px 0 5px;border-radius:7px;background:%s;color:%s;text-align:center;line-height:1.15;%s">'
                               '<span style="display:block;font-size:10px;text-transform:uppercase;opacity:.85;">%s</span>'
                               '<span style="display:block;font-size:14px;font-weight:700;">%d</span>'
                               '<span style="display:block;font-size:11px;">%d</span></span>' % (bg, fg, bordo, GG[d.weekday()], d.day, x["score"]))
                  h.append('</div>')
                  for liv in (4, 3):
                      s = intervalli(g, liv)
                      if s:
                          h.append('<div style="font-size:14px;margin-top:2px;"><b>%s:</b> %s</div>' % (LIV[liv].capitalize(), e(s)))
                  h.append('</div>')
              if altri:
                  h.append('<div style="font-size:14px;color:#566151;margin:0 4px 14px;">Sotto «buono» nei prossimi giorni: %s.</div>'
                           % "; ".join("%s (al massimo %d %s)" % (e(r["nome"]), b["score"], corto(b["data"])) for r, g, b in altri))
              h.append('<div style="margin:4px 4px 16px;"><a href="%s" style="display:inline-block;background:#39663A;color:#FFFFFF;text-decoration:none;font-weight:700;border-radius:99px;padding:10px 18px;">Apri Radar Porcini</a></div>' % e(sito))
              h.append('<div style="font-size:12px;color:#566151;margin:0 4px;line-height:1.45;">Punteggio da 0 a 100: buono da 45, ottimo da 65. È una stima: guarda la scheda del punto prima di andare.%s<br><br>'
                       'Ricevi questa mail dal flusso «Aggiorna Radar Porcini» del repository the-marox/progetti. Per non riceverla più, cancella il segreto POSTI del repository o disattiva il flusso.</div>'
                       % (e(" Pioggia misurata fino al " + pioggia + ".") if pioggia else ""))
              h.append('</div></div>')
              return testo, "".join(h)


          import json, os, smtplib, sys
          from email.message import EmailMessage
          tmp = os.environ["RUNNER_TEMP"]
          a = json.load(open(os.path.join(tmp, "avvisi.json"), encoding="utf-8"))
          print("posti controllati: %d, giorni buoni o ottimi: %d, nuovi: %d" % (len(a.get("posti") or []), len(a.get("segnalati") or {}), len(a.get("nuovi") or [])))
          if a.get("invia"):
              testo, pagina = componi(a, os.environ["SITO_URL"])
              utente, chiave = os.environ.get("GMAIL_USER", "").strip(), os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
              if not utente or not chiave:
                  sys.exit("Mancano i segreti GMAIL_USER o GMAIL_APP_PASSWORD: mail non inviata")
              m = EmailMessage()
              m["From"], m["To"], m["Subject"] = "Radar Porcini <%s>" % utente, utente, a["oggetto"]
              m.set_content(testo)
              m.add_alternative(pagina, subtype="html")
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=60) as s:
                  s.login(utente, chiave)
                  s.send_message(m)
              print("mail inviata: " + a["oggetto"])
          else:
              print("nessun giorno nuovo da segnalare: nessuna mail")
          # si ricordano solo i giorni gia' segnalati (numeri dei posti e date, niente nomi):
          # se la mail non parte non si arriva qui, e domani l'avviso viene riproposto
          os.makedirs(os.path.join(tmp, "stato"), exist_ok=True)
          json.dump({"segnalati": a.get("segnalati") or {}}, open(os.path.join(tmp, "stato", "avvisi.json"), "w"))
          PY

      - name: Ricorda gli avvisi
        if: steps.mail.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/stato
          key: avvisi-${{ github.run_id }}-${{ github.run_attempt }}
