name: Radar Porcini - dati del mattino

on:
  schedule:
    - cron: "16 8 * * *"   # 10:16 con l'ora legale, 9:16 con l'ora solare: subito dopo la lettura CFR delle 9
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-porcini-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prendi il sito
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pacchetti
        run: |
          python -m pip install --quiet numpy pillow pygrib playwright
          python -m playwright install --with-deps chromium

      - name: Aggiorna i dati
        run: |
          mkdir -p "$RUNNER_TEMP/lavoro"
          cp radar-porcini/aggiorna.py "$RUNNER_TEMP/lavoro/"
          cd "$RUNNER_TEMP/lavoro"
          timeout 600 python aggiorna.py misure || true
          timeout 600 python aggiorna.py previsioni || true
          timeout 600 python aggiorna.py archivio "$GITHUB_WORKSPACE/radar-porcini/storico.json" || true
          timeout 900 python aggiorna.py radar "$GITHUB_WORKSPACE/radar-porcini/radar.json" || true
          python aggiorna.py valida "$GITHUB_WORKSPACE/radar-porcini"
          cat esito.json || true

      - name: Pubblica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar-porcini/*.json
          if git diff --cached --quiet; then echo "Niente di nuovo da pubblicare"; exit 0; fi
          git commit -q -m "Dati del $(date -u +%Y-%m-%d)"
          git push
